<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Vice Harbor">
<meta name="theme-color" content="#1a2233">
<meta name="description" content="Vice Harbor: an original 2D top-down open-world crime game. Explore a sun-soaked coastal city on foot and by car, steal cars, outrun the police, run six story missions for Otto Reyes — and drive taxis, find hidden hubcaps, tune cars at Otto's garage, and watch the city go from dawn to night.">
<!-- An inline SVG favicon, so the browser never asks the server for one. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a2233'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f2c94c' font-family='sans-serif' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E">
<title>Vice Harbor — an open-world crime game</title>
<style>
  :root {
    --backdrop: #1a2233;
    --ink: #f5f1e6;
    --muted: #c9c2ae;
    --gold: #f2c94c;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--backdrop);
    -webkit-font-smoothing: antialiased;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  noscript {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font: 18px system-ui, sans-serif;
    text-align: center;
    padding: 0 24px;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Harbor: explore the city on foot and by car, steal cars, outrun the police, run missions for Otto Reyes, drive taxis and find hidden hubcaps"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Vice Harbor needs JavaScript to play.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
